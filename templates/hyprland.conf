# Bell Labs — Hyprland (hyprlang). Source it from hyprland.conf:
#   source = ~/.config/hypr/bell-labs.conf
general {
    border_size = 3
    gaps_in = 3
    gaps_out = 6
    col.active_border = rgb({{border_active.hex}})
    col.inactive_border = rgb({{border_inactive.hex}})
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

group {
    col.border_active = rgb({{border_active.hex}})
    col.border_inactive = rgb({{border_inactive.hex}})
    groupbar {
        font_family = GoMono Nerd Font
        text_color = rgb({{foreground.hex}})
        col.active = rgb({{selection_alt.hex}})
        col.inactive = rgb({{background_alt.hex}})
        gradients = false
    }
}

misc {
    background_color = rgb({{desktop.hex}})
}
