# Bell Labs — fuzzel
[main]
font=GoMono Nerd Font:size=12
prompt="> "
icons-enabled=no
width=48
lines=12
horizontal-pad=12
vertical-pad=8

[colors]
background={{background.hex}}ff
text={{foreground.hex}}ff
prompt={{accent.hex}}ff
input={{foreground.hex}}ff
match={{accent.hex}}ff
selection={{selection.hex}}ff
selection-text={{foreground.hex}}ff
selection-match={{red.hex}}ff
border={{border_active.hex}}ff

[border]
width=3
radius=0
