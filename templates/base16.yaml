# Bell Labs — base16 scheme, for Stylix, tinty and other base16 tools.
system: "base16"
name: "{{name}}"
author: "Plan 9 libdraw palette, arranged for base16"
variant: "{{mode}}"
palette:
  base00: "{{background}}"
  base01: "{{background_alt}}"
  base02: "{{selection}}"
  base03: "{{muted}}"
  base04: "{{foreground_dim}}"
  base05: "{{foreground}}"
  base06: "{{foreground}}"
  base07: "{{foreground}}"
  base08: "{{red}}"
  base09: "{{yellow}}"
  base0A: "{{bright_yellow}}"
  base0B: "{{green}}"
  base0C: "{{cyan}}"
  base0D: "{{accent}}"
  base0E: "{{magenta}}"
  base0F: "{{border_active}}"
